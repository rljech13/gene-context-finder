[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-context-finder"
version = "0.11.1"
description = "Find genes and their genomic surroundings from DNA or protein queries"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gene-context = "genecontext.cli:main"

[tool.setuptools]
packages = ["genecontext"]

[tool.setuptools.package-data]
genecontext = ["*.txt", "vendor/*.js", "vendor/*.txt", "vendor/*.json", "vendor/review/*"]
