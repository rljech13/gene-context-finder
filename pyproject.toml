[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-context-finder"
version = "0.12.2"
description = "Find genes and their genomic surroundings from DNA or protein queries"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
structures = ["gemmi>=0.7.3,<0.8"]

[project.scripts]
gene-context = "genecontext.cli:main"

[tool.setuptools]
packages = ["genecontext"]

[tool.setuptools.package-data]
genecontext = ["*.txt", "vendor/*.js", "vendor/*.txt", "vendor/*.json", "vendor/review/*.txt", "vendor/legacy_review/*"]
