name: Python unit tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
      - run: python -m genecontext --help
      - name: Check clean package installation
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/gcf-wheel"
          python -m venv "$RUNNER_TEMP/gcf-install"
          "$RUNNER_TEMP/gcf-install/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP/gcf-wheel/"*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gcf-install/bin/gene-context" --help
